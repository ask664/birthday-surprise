<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surprise 🎁</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    overflow: hidden;
}

#start h1 {
    font-size: 45px;
}

button {
    padding: 16px 30px;
    font-size: 20px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
}

#birthday {
    display: none;
    padding: 25px;
}

#birthday h1 {
    font-size: clamp(40px, 9vw, 80px);
    animation: flash 0.8s infinite alternate;
}

#birthday h2 {
    font-size: clamp(24px, 5vw, 38px);
}

#birthday p {
    font-size: clamp(20px, 4vw, 30px);
    line-height: 1.6;
}

@keyframes flash {
    from {
        opacity: 0.45;
        transform: scale(0.96);
    }
    to {
        opacity: 1;
        transform: scale(1.05);
    }
}

.confetti {
    position: fixed;
    top: -20px;
    font-size: 25px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<div id="start">

    <h1>🎁</h1>

    <h2>Hey Neelisha!</h2>

    <p>Ek chhota sa surprise hai 😜</p>

    <button onclick="surprise()">
        Click Here 😄
    </button>

</div>


<div id="birthday">

    <h1>
        🎉 HAPPY BIRTHDAY NEELISHA!! 🎂🥳
    </h1>

    <h2>
        Be Happy ❤️ & Enjoy Life! 😄
    </h2>

    <p>
        Aur life mein jyada darne ka nahi... 😎
        <br><br>

        <b>
        JAAT THARA GYM PARTNER HAI 💪😂
        </b>

        <br><br>

        😎💪 :D :D
    </p>

</div>


<script>

function surprise() {

    document.getElementById("start").style.display = "none";

    document.getElementById("birthday").style.display = "block";

    confetti();
}


function confetti() {

    const emojis = ["🎉","🎂","🥳","✨","😂","💪","❤️"];

    for (let i = 0; i < 80; i++) {

        const piece = document.createElement("div");

        piece.className = "confetti";

        piece.innerText =
            emojis[Math.floor(Math.random() * emojis.length)];

        piece.style.left =
            Math.random() * 100 + "vw";

        piece.style.animationDuration =
            (2 + Math.random() * 3) + "s";

        piece.style.animationDelay =
            Math.random() + "s";

        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 6000);
    }
}

</script>

</body>
</html>
